plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

import groovy.json.JsonOutput
import java.awt.Color
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata

// Generate original item textures, decorative block models, and recipes into
// build/ instead of the source tree. Register task-backed output as a resource
// source so Gradle orders resource and source-jar tasks correctly.
def generatedAssetsDir = layout.buildDirectory.dir('generated/littleCraftAssets')
def generateLittleCraftAssets = tasks.register('generateLittleCraftAssets') {
    outputs.dir(generatedAssetsDir)

    doLast {
        def outputRoot = generatedAssetsDir.get().asFile
        def itemIds = [
                'coffee', 'iced_coffee', 'hot_chocolate', 'vanilla_latte', 'strawberry_milk',
                'babyccino', 'chocolate_milk', 'apple_juice', 'orange_juice', 'warm_milk',
                'baby_food_jar', 'applesauce', 'baby_biscuits', 'cookies', 'cupcake', 'pancakes',
                'cereal_bowl', 'rubber_duck', 'teddy_bear', 'bunny_plushie', 'cat_plushie',
                'elephant_plushie', 'dinosaur_plushie', 'frog_plushie', 'puppy_plushie', 'rattle',
                'building_blocks', 'toy_train', 'toy_ball', 'musical_toy', 'stuffed_star',
                'toy_mobile', 'teething_ring', 'baby_rattle', 'diaper', 'baby_blanket', 'storybook',
                'pacifier_clip', 'baby_wipes', 'sippy_cup', 'high_chair', 'diaper_bag'
        ]
        def assetDir = new File(outputRoot, 'assets/littlecraftplus')
        def itemTextureDir = new File(assetDir, 'textures/item')
        def blockTextureDir = new File(assetDir, 'textures/block')
        def itemDefinitions = new File(assetDir, 'items')
        def itemModels = new File(assetDir, 'models/item')
        def blockModels = new File(assetDir, 'models/block')
        def blockStates = new File(assetDir, 'blockstates')
        [itemTextureDir, blockTextureDir, itemDefinitions, itemModels, blockModels, blockStates].each { it.mkdirs() }

        def writeTexture = { File file, String key ->
            int hash = key.hashCode()
            float hue = Math.abs(hash % 360) / 360.0f
            float accentHue = (float) ((hue + 0.42f) % 1.0f)
            Color main = Color.getHSBColor(hue, 0.68f, 0.92f)
            Color shade = Color.getHSBColor(hue, 0.78f, 0.52f)
            Color accent = Color.getHSBColor(accentHue, 0.55f, 1.0f)
            def image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    if (x < 3 || x > 12 || y < 2 || y > 13) continue
                    Color pixel = ((x + y + Math.abs(hash)) % 5 == 0) ? shade : main
                    if ((x * 3 + y + Math.abs(hash >> 4)) % 13 == 0) pixel = accent
                    if (y == 13 || x == 3 || x == 12) pixel = shade
                    image.setRGB(x, y, pixel.getRGB())
                }
            }
            ImageIO.write(image, 'png', file)
        }

        def cube = { List from, List to ->
            [from: from, to: to, faces: [
                    north: [texture: '#all'], south: [texture: '#all'],
                    east: [texture: '#all'], west: [texture: '#all'],
                    up: [texture: '#all'], down: [texture: '#all']
            ]]
        }

        itemIds.each { id ->
            writeTexture(new File(itemTextureDir, "${id}.png"), id)
            boolean blockItem = id in ['high_chair', 'diaper_bag']
            def model = blockItem
                    ? [parent: "littlecraftplus:block/${id}"]
                    : [parent: 'minecraft:item/generated', textures: [layer0: "littlecraftplus:item/${id}"]]
            new File(itemModels, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(model))
            new File(itemDefinitions, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    model: [type: 'minecraft:model', model: "littlecraftplus:item/${id}"]
            ]))

            def recipe = [
                    type: 'minecraft:crafting_shapeless',
                    ingredients: [
                            [item: 'minecraft:paper'],
                            [item: 'minecraft:string'],
                            [item: 'minecraft:white_wool']
                    ],
                    result: [id: "littlecraftplus:${id}", count: 1]
            ]
            def recipeFile = new File(outputRoot, "data/littlecraftplus/recipe/${id}.json")
            recipeFile.parentFile.mkdirs()
            recipeFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(recipe))
        }

        ['high_chair', 'diaper_bag'].each { id ->
            writeTexture(new File(blockTextureDir, "${id}.png"), "block_${id}")
            def elements = id == 'high_chair'
                    ? [cube([2, 0, 2], [4, 10, 4]), cube([12, 0, 2], [14, 10, 4]),
                       cube([2, 0, 12], [4, 10, 14]), cube([12, 0, 12], [14, 10, 14]),
                       cube([2, 9, 2], [14, 11, 14]), cube([2, 10, 12], [14, 16, 14]),
                       cube([3, 10, 4], [13, 12, 7])]
                    : [cube([2, 2, 3], [14, 13, 13]), cube([3, 10, 2], [13, 14, 3]),
                       cube([5, 0, 4], [11, 2, 12])]
            def blockModel = [
                    parent: 'minecraft:block/block',
                    textures: [particle: "littlecraftplus:block/${id}", all: "littlecraftplus:block/${id}"],
                    elements: elements
            ]
            new File(blockModels, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(blockModel))
            new File(blockStates, "${id}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    variants: ['': [model: "littlecraftplus:block/${id}"]]
            ]))
        }
    }
}

sourceSets.main.resources.srcDir(generateLittleCraftAssets)

// Some initial placeholder item definitions are also present as static
// resources. Exclude duplicate paths deliberately; source definitions remain
// authoritative and the generated textures/models still get packaged.
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
